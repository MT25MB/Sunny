<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunny — Your Friendly Computer Helper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="widget-window">
  <header class="window-bar"><span class="display">Sunny Helper</span><span class="dots"><span class="dot"></span><span class="dot"></span></span></header>
  <div class="content">
    <div class="top">
      <div class="mascot-wrap">
        <div id="bubble" class="thought-bubble hidden">...</div>
        <img id="mascot" class="mascot" src="mascot.png" alt="Sunny, your helper" width="96" height="96">
      </div>
      <h1 id="status" class="display" aria-live="polite">Hello! I'm ready to help.</h1>
    </div>
    <button id="mic" class="mic-button" aria-pressed="false"></button>
    <form id="form">
      <label for="ask" class="sr-only">Type what you need help with</label>
      <textarea id="ask" rows="2" class="big-input" placeholder="Type what you need help with..."></textarea>
      <button id="askBtn" type="submit" class="ask-button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg> Ask
      </button>
    </form>
    <div id="quick" class="grid"></div>
    <section id="stepsBox" class="hidden">
      <h2 class="display">What I'm doing</h2>
      <ol id="steps"></ol>
      <button id="again" class="chip again hidden">Ask something else</button>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
