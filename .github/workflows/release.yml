name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0). Created automatically if it does not exist.'
        required: true

permissions:
  contents: write

jobs:
  # Pushes to main ship a release automatically whenever the version in
  # package.json changes (the `chore: bump version to ...` commits). Every
  # other push — including the screenshot bot's [skip ci] commits — stops
  # here and never builds. Tag pushes and manual dispatch always release.
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this push should release
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch push: release only when the version in package.json
          # changed between the parent commit and this one.
          new_version=$(node -p "require('./package.json').version")
          old_version=$(git show "HEAD^:package.json" 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version||'')}catch{console.log('')}})" || echo "")

          echo "version: ${old_version} -> ${new_version}"

          if [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
            echo "Version bumped; will release v${new_version}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged (${new_version}); nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: sunny-win
            installer: '*.exe'
          - os: macos-latest
            artifact_name: sunny-mac
            installer: '*.dmg'
          - os: ubuntu-latest
            artifact_name: sunny-linux
            installer: '*.deb'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build renderer
        run: npm run build

      - name: Build & Package
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

       # ------------------------------------------------------------------
       # Code signing with SignPath (free for open source).
       #
       # A signed installer stops Windows SmartScreen from warning the
       # person installing it, and stops Defender treating the updater as
       # unknown. The step is skipped unless the organisation variable is
       # set, because until the project has a certificate, a signing policy
       # and the Foundation's approval the request is rejected and the
       # release would fail. Until then the unsigned installer is published.
       # ------------------------------------------------------------------
      - name: Upload unsigned installer
        id: upload-unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          # Deliberately not "sunny-*": the publish job downloads every
          # artifact matching that pattern, and the unsigned installer
          # must not end up in the release.
          name: win-unsigned
          path: out/make/**/${{ matrix.installer }}
          if-no-files-found: error

      - name: Sign the installer
        id: sign
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        # A signing failure must not stop the release. If SignPath rejects the
        # request, the step is marked failed but the unsigned installer is
        # published instead, and the failure is still visible in the log.
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v3
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Upload signed installer
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: signed-installer/
          if-no-files-found: error

      - name: Verify packaged assets
        # A green build says the bundler succeeded; it says nothing about
        # what survived packaging. This is what caught the images being
        # deleted by an ignore rule while the app still built cleanly.
        run: node scripts/verify-packaged-assets.cjs

      - name: Upload Squirrel updater files
        # The Windows auto-updater needs the nupkg and RELEASES manifest
        # alongside the installer; without them installed copies stop
        # updating. Uploaded under sunny-* so the publish job picks them up.
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: sunny-win-squirrel
          path: |
            out/make/**/*.nupkg
            out/make/**/RELEASES
          if-no-files-found: error

      - name: Upload Artifacts
        # Skipped when the installer was signed: the signed copy is uploaded
        # under the same artifact name, and two uploads with one name in a
        # single run is an error.
        if: steps.sign.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          # Only the per-leg make glob can match: installers land at
          # out/make/<maker>/<arch>/<file> (e.g. out/make/deb/x64/foo.deb),
          # three segments under out/, so out/**/*.deb never matches.
          path: out/make/**/${{ matrix.installer }}
          # Fail loudly if a leg produced nothing. The default is "warn",
          # which let the Windows installer go missing without a word.
          if-no-files-found: error

  publish:
    name: publish
    # Waits for every matrix leg. Creating the release from inside one leg
    # meant the download ran while the other legs were still uploading, so
    # the release was published without the Windows installer -- it was not
    # discoverable yet, not missing. The two problems looked the same: no
    # .exe on the release page.
    needs: [detect, build]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'sunny-*'
          path: out/make/
          merge-multiple: true

      - name: Name the Linux package after its system
        # The .deb carried only a version number, which said nothing about
        # which operating system it was for. Someone on Windows picked it
        # from the release page by mistake and could not open it. The
        # landing page links to this name directly, so it has to be the
        # same on every release.
        run: |
          set -euo pipefail
          deb=$(find out/make -name '*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "No Linux package was downloaded." >&2
            exit 1
          fi
          mv "$deb" out/make/Sunny-Linux-amd64.deb

      - name: Create Release
        # softprops/action-gh-release creates the tag itself when it does
        # not exist yet (created from target_commitish, pinned to the commit
        # being released), and creates or updates the release on repeated
        # runs — assets are overwritten by default.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/make/**/*.exe
            out/make/**/*.dmg
            out/make/Sunny-Linux-amd64.deb
            out/make/**/*.nupkg
            out/make/**/RELEASES
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
