name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: sunny-win
            installer: '*.exe'
          - os: macos-latest
            artifact_name: sunny-mac
            installer: '*.dmg'
          - os: ubuntu-latest
            artifact_name: sunny-linux
            installer: '*.deb'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build renderer
        run: npm run build

      - name: Build & Package
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

       # ------------------------------------------------------------------
       # Code signing with SignPath (free for open source).
       #
       # A signed installer stops Windows SmartScreen from warning the
       # person installing it, and stops Defender treating the updater as
       # unknown. The step is skipped unless the organisation variable is
       # set, because until the project has a certificate, a signing policy
       # and the Foundation's approval the request is rejected and the
       # release would fail. Until then the unsigned installer is published.
       # ------------------------------------------------------------------
      - name: Upload unsigned installer
        id: upload-unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          # Deliberately not "sunny-*": the publish job downloads every
          # artifact matching that pattern, and the unsigned installer
          # must not end up in the release.
          name: win-unsigned
          path: out/make/**/${{ matrix.installer }}
          if-no-files-found: error

      - name: Sign the installer
        id: sign
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        # A signing failure must not stop the release. If SignPath rejects the
        # request, the step is marked failed but the unsigned installer is
        # published instead, and the failure is still visible in the log.
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v3
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Upload signed installer
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: signed-installer/
          if-no-files-found: error

      - name: Verify packaged assets
        # A green build says the bundler succeeded; it says nothing about
        # what survived packaging. This is what caught the images being
        # deleted by an ignore rule while the app still built cleanly.
        run: node scripts/verify-packaged-assets.cjs

      - name: Upload Artifacts
        # Skipped when the installer was signed: the signed copy is uploaded
        # under the same artifact name, and two uploads with one name in a
        # single run is an error.
        if: steps.sign.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          # Only the per-leg make glob can match: installers land at
          # out/make/<maker>/<arch>/<file> (e.g. out/make/deb/x64/foo.deb),
          # three segments under out/, so out/**/*.deb never matches.
          path: out/make/**/${{ matrix.installer }}
          # Fail loudly if a leg produced nothing. The default is "warn",
          # which let the Windows installer go missing without a word.
          if-no-files-found: error

  publish:
    name: publish
    # Waits for every matrix leg. Creating the release from inside one leg
    # meant the download ran while the other legs were still uploading, so
    # the release was published without the Windows installer -- it was not
    # discoverable yet, not missing. The two problems looked the same: no
    # .exe on the release page.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'sunny-*'
          path: out/make/
          merge-multiple: true

      - name: Name the Linux package after its system
        # The .deb carried only a version number, which said nothing about
        # which operating system it was for. Someone on Windows picked it
        # from the release page by mistake and could not open it. The
        # landing page links to this name directly, so it has to be the
        # same on every release.
        run: |
          set -euo pipefail
          deb=$(find out/make -name '*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "No Linux package was downloaded." >&2
            exit 1
          fi
          mv "$deb" out/make/Sunny-Linux-amd64.deb

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/make/**/*.exe
            out/make/**/*.dmg
            out/make/Sunny-Linux-amd64.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
