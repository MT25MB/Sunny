name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: sunny-win
            installer: '*.exe'
          - os: macos-latest
            artifact_name: sunny-mac
            installer: '*.dmg'
          - os: ubuntu-latest
            artifact_name: sunny-linux
            installer: '*.deb'
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build renderer
        run: npm run build

      - name: Build & Package
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
       # ------------------------------------------------------------------
       # OPTIONAL: SignPath.io free code signing for open source
       # Uncomment and configure if you want to sign Windows installers
       # to avoid SmartScreen "Windows protected your PC" warning.
       # See https://signpath.io/ for setup instructions.
       # ------------------------------------------------------------------
       # - name: Sign Windows installer with SignPath
       #   if: runner.os == 'Windows'
       #   uses: SignPath/signpath-action@v2
       #   with:
       #     project_id: ${{ secrets.SIGNPATH_PROJECT_ID }}
       #     project_key: ${{ secrets.SIGNPATH_PROJECT_KEY }}
       #     # artifacts must be specified relative to workspace root
       #     artifacts: 'out/make/**/*.exe'
       #     # optional: add timestamp server for LTV
       #     timestamp_server: 'http://timestamp.digicert.com'
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          # Only the per-leg make glob can match: installers land at
          # out/make/<maker>/<arch>/<file> (e.g. out/make/deb/x64/foo.deb),
          # three segments under out/, so out/**/*.deb never matches.
          path: out/make/**/${{ matrix.installer }}
      
      # One writer per release. This used to run on all three matrix legs at
      # once, so three action-gh-release processes raced on the same release:
      # one deleted an asset while another tried to re-upload it, which
      # surfaced as "Not Found - delete-a-release-asset" and cancelled the
      # other legs. Restricted to a single leg and fed every platform's
      # installer via download-artifact.
      - name: Download artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v8
        with:
          pattern: 'sunny-*'
          path: out/make/
          merge-multiple: true

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/make/**/*.exe
            out/make/**/*.dmg
            out/make/**/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}