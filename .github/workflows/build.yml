name: Build and Release Desktop App

on:
  push:
    branches:
      - main  # 1. Triggers on every commit or PR merge to main

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and package app
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Dynamically create a unique tag using the short commit SHA
      - name: Set Release Tag
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2  # Upgraded to v2 to handle concurrent multi-OS uploads safely
        with:
          tag_name: rolling-release-${{ steps.vars.outputs.sha_short }}
          name: Release ${{ steps.vars.outputs.sha_short }}
          body: |
            Automated build for commit ${{ github.sha }}
            Merged/Pushed to main branch.
          files: |
            out/**/*.exe
            out/**/*.dmg
            out/**/*.zip
            out/**/*.deb
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
