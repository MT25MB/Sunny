name: Build and Release Desktop App

on:
  push:
    branches:
      - main  # Triggers on every commit or PR merge to main

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to fetch previous version tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build and package app
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename binaries for clarity
        shell: bash
        run: |
          mkdir -p dist_releases
          find out -name "Sunny-Setup.exe" -exec cp {} dist_releases/Sunny-Windows-Setup.exe \;
          find out -name "*.dmg" -exec cp {} dist_releases/Sunny-macOS.dmg \;
          find out -name "Sunny-darwin-arm64-*.zip" -exec cp {} dist_releases/Sunny-macOS-AppleSilicon.zip \;
          find out -name "*.deb" -exec cp {} dist_releases/Sunny-Linux-Installer.deb \;
          find out -name "Sunny-linux-x64-*.zip" -exec cp {} dist_releases/Sunny-Linux-Portable.zip \;

      - name: Determine Next Version Tag
        id: vars
        shell: bash
        run: |
          git fetch --tags
          # Find the latest semver tag, default to v1.0.0 if none exist
          LATEST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Calculated new version tag: $NEW_TAG"

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.new_tag }}
          name: Release ${{ steps.vars.outputs.new_tag }}
          body: |
            Automated rolling release for commit ${{ github.sha }}
            Merged/Pushed to main branch.
          files: |
            dist_releases/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
