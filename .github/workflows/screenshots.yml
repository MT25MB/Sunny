name: Capture Screenshots

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history, so the screenshot commit can be rebased onto main.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build renderer
        run: npm run build

      - name: Package Linux
        run: npm run package:linux

      - name: Install Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium

      - name: Launch Sunny & capture screenshots
        env:
          CAPTURE_SCREENSHOTS: 'true'
          DISPLAY: ':99'
        run: |
          cd out/Sunny-linux-x64
          # The runner is headless; without a display Electron aborts with
          # "Missing X server or $DISPLAY" during platform init and the CDP
          # port never opens. Xvfb provides a virtual one. --no-sandbox is
          # also required: the runner exposes no root-owned chrome-sandbox
          # SUID helper, which would abort with
          # FATAL:sandbox/linux/suid/suid_sandbox_host.cc.
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          sleep 1
          # The app also opens this port itself when CAPTURE_SCREENSHOTS is
          # set (see createWindow in main.cjs); passing it here keeps the
          # workflow self-contained.
          ./sunny-desktop --no-sandbox --remote-debugging-port=9222 &
          APP_PID=$!
          # Wait for app to be ready (model load + window)
          sleep 10
          node ../../scripts/capture-screenshots.cjs
          kill $APP_PID

      - name: Commit screenshots
        # This workflow is triggered by a tag push, so the checkout is a
        # detached HEAD and a plain "git push" fails. git-auto-commit-action
        # cannot be used here either: its "branch" input checks the branch
        # out over the working tree, which refuses to overwrite the freshly
        # captured screenshots. So the commit is made explicitly and pushed
        # to main, where the landing page picks the images up.
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/screenshots
          if git diff --staged --quiet; then
            echo 'No screenshot changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update screenshots [skip ci]' --no-verify
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo 'Could not rebase the screenshot commit onto main; skipping.'
            exit 0
          fi
          git push origin HEAD:main
