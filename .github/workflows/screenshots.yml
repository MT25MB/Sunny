name: Capture Screenshots

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build renderer
        run: npm run build

      - name: Package Linux
        run: npm run package:linux

      - name: Install Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium

      - name: Launch Sunny & capture screenshots
        env:
          CAPTURE_SCREENSHOTS: 'true'
          DISPLAY: ':99'
        run: |
          cd out/Sunny-linux-x64
          # The runner is headless; without a display Electron aborts with
          # "Missing X server or $DISPLAY" during platform init and the CDP
          # port never opens. Xvfb provides a virtual one. --no-sandbox is
          # also required: the runner exposes no root-owned chrome-sandbox
          # SUID helper, which would abort with
          # FATAL:sandbox/linux/suid/suid_sandbox_host.cc.
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          sleep 1
          ./sunny-desktop --no-sandbox --remote-debugging-port=9222 &
          APP_PID=$!
          # Wait for app to be ready (model load + window)
          sleep 10
          node ../../scripts/capture-screenshots.cjs
          kill $APP_PID

      - name: Commit screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update screenshots [skip ci]"
          file_pattern: public/assets/screenshots/*.png
          commit_options: '--no-verify'